name: ci

on:
  push:
  pull_request:

jobs:
  test:
    # Windows because the library and tests are cross-platform but the Excel oracle tests only run there;
    # hosted runners have no Excel, so those tests are skipped and the recorded answers (*.golden.txt) are replayed instead.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          # 10.0.x builds everything (and understands .slnx); 8.0.x is the runtime the net8.0 tests run on.
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build the library (netstandard2.0, net8.0 and net10.0, warnings are errors)
        run: dotnet build src/OpenSheet -c Release -warnaserror
      - name: Build the solution (tests and benchmarks)
        run: dotnet build OpenSheet.slnx -c Release
      - name: Test (net8.0 and net10.0)
        run: dotnet test tests/OpenSheet.Tests -c Release --no-build --logger "trx;LogFileName=results.trx"
      - name: Pack
        run: dotnet pack src/OpenSheet -c Release --no-build -o artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.os }}
          path: |
            artifacts/*.nupkg
            tests/OpenSheet.Tests/TestResults/*.trx
